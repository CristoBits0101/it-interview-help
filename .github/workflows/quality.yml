name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node v7
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: npx --yes pnpm@12.16.1 install --frozen-lockfile
      - run: npx --yes pnpm@12.16.1 run validate
      - run: npx --yes pnpm@12.16.1 audit --audit-level=moderate
      - run: npx --yes pnpm@12.16.1 exec playwright install --with-deps chromium
      - run: npx --yes pnpm@12.16.1 run test:e2e
      - run: git diff --exit-code -- package.json pnpm-lock.yaml
